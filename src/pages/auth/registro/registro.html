<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Store - Registro</title>
  <link rel="stylesheet" href="./registro.css" />
</head>

<body>
  <div class="page">
    <div class="form-card">
      <div class="form-card__header">
        <span class="form-card__logo">🍔</span>
        <h1 class="form-card__title">Crear cuenta</h1>
        <p class="form-card__subtitle">Completa tus datos para registrarte</p>
      </div>

      <form id="registerForm" class="form">
        <div class="form__group">
          <label for="email" class="form__label">Email</label>
          <input type="email" id="email" placeholder="tumail@mail.com" class="form__input" />
        </div>

        <div class="form__group">
          <label for="password" class="form__label">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" class="form__input" />
        </div>

        <button type="submit" class="btn">Registrarse</button>
      </form>

      <p class="form-card__footer">
        ¿Ya tenes cuenta?
        <a href="../login/login.html" class="link">Inicia sesion</a>
      </p>
    </div>
  </div>

  <script type="module" src="./registro.ts"></script>
</body>

</html>
